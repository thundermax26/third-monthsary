<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Third Monthsary, My Love ♡</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="cover-page">
  <main class="cover-scene">
    <div class="soft-glow glow-one"></div>
    <div class="soft-glow glow-two"></div>

    <div class="flower-field" aria-hidden="true">
      <img class="flower f1" src="assets/flowers/flower1.png" alt="" />
      <img class="flower f2" src="assets/flowers/flower2.png" alt="" />
      <img class="flower f3" src="assets/flowers/flower3.png" alt="" />
      <img class="flower f4" src="assets/flowers/flower4.png" alt="" />
      <img class="flower f5" src="assets/flowers/flower5.png" alt="" />
      <img class="flower f6" src="assets/flowers/flower6.png" alt="" />
      <img class="flower f7" src="assets/flowers/flower7.png" alt="" />
      <img class="flower f8" src="assets/flowers/flower8.png" alt="" />
      <img class="flower f9" src="assets/flowers/flower1.png" alt="" />
      <img class="flower f10" src="assets/flowers/flower3.png" alt="" />
      <img class="flower f11" src="assets/flowers/flower5.png" alt="" />
      <img class="flower f12" src="assets/flowers/flower7.png" alt="" />
    </div>

    <section class="cover-message" id="coverMessage">
      <p class="eyebrow">A little love letter made just for you</p>
      <h1>Happy Third Monthsary</h1>
      <p class="subtitle">♡ Leila ♡</p>
      <p class="initials">My Love</p>
      <p class="hint">There is something waiting for you inside ♡</p>
    </section>

    <button class="envelope-wrap" id="openEnvelope" type="button" aria-label="Open our love letter">
      <span class="envelope-shadow"></span>
      <span class="envelope">
        <span class="envelope-back"></span>
        <span class="envelope-paper"></span>
        <span class="envelope-flap"></span>
        <span class="envelope-front"></span>
        <span class="seal">R + L</span>
      </span>
      <span class="open-text">Open me</span>
    </button>

    <p class="tiny-footer">Made with love ♡</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
